<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#ef4444" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <!-- Car Body - Fortuner SUV High Ground Clearance -->
      <g transform="translate(40, 50)">
        <ellipse cx="160" cy="165" rx="140" ry="18" fill="#000" fill-opacity="0.5"/>
        <!-- Roof Rail -->
        <line x1="90" y1="40" x2="210" y2="36" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
        <path d="M20,135 L35,80 Q55,50 100,45 L210,40 Q250,44 280,72 L310,105 L315,135 Z" fill="#b91c1c"/>
        <path d="M95,52 L200,48 L210,85 L80,85 Z" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
        <polygon points="285,100 312,102 300,118 280,114" fill="#fecaca"/>
        <!-- Large SUV Wheels -->
        <circle cx="85" cy="140" r="32" fill="#0f172a" stroke="#334155" stroke-width="5"/>
        <circle cx="85" cy="140" r="16" fill="#cbd5e1"/>
        <circle cx="245" cy="140" r="32" fill="#0f172a" stroke="#334155" stroke-width="5"/>
        <circle cx="245" cy="140" r="16" fill="#cbd5e1"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">B 1945 RFS</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Toyota Fortuner 2.8 VRZ</text>
</svg>