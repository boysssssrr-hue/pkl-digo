        <rect x="105" y="55" width="65" height="40" rx="4" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
        <path d="M180,55 L240,55 L265,95 L180,95 Z" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
        <circle cx="85" cy="140" r="26" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
        <circle cx="85" cy="140" r="13" fill="#e2e8f0"/>
        <circle cx="235" cy="140" r="26" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
        <circle cx="235" cy="140" r="13" fill="#e2e8f0"/>
      </g>
    
