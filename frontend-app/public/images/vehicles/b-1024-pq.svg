<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#10b981" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <!-- Car Body - Innova Zenix -->
      <g transform="translate(40, 60)">
        <!-- Shadow -->
        <ellipse cx="160" cy="150" rx="140" ry="18" fill="#000" fill-opacity="0.4"/>
        <!-- Main Body -->
        <path d="M20,130 L40,85 Q60,60 110,50 L200,45 Q240,48 270,75 L300,105 L305,130 Z" fill="#047857"/>
        <!-- Windshield & Windows -->
        <path d="M105,58 L190,54 L200,85 L85,85 Z" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
        <path d="M205,54 L245,70 L245,85 L205,85 Z" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
        <!-- Headlights -->
        <polygon points="280,100 305,102 295,115 275,110" fill="#6ee7b7"/>
        <!-- Wheels -->
        <circle cx="80" cy="135" r="28" fill="#0f172a" stroke="#475569" stroke-width="4"/>
        <circle cx="80" cy="135" r="14" fill="#cbd5e1"/>
        <circle cx="240" cy="135" r="28" fill="#0f172a" stroke="#475569" stroke-width="4"/>
        <circle cx="240" cy="135" r="14" fill="#cbd5e1"/>
        <!-- Grille & Toyota Emblem -->
        <rect x="290" y="112" width="15" height="18" rx="2" fill="#0f172a"/>
        <ellipse cx="295" cy="120" rx="4" ry="3" fill="#ffffff"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">B 1024 PQ</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Toyota Innova Zenix 2.0 V</text>
</svg>