<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#6366f1" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <g transform="rotate(-15 200 150)">
        <!-- Blades -->
        <polygon points="180,150 310,135 300,150 180,150" fill="#e2e8f0"/>
        <polygon points="180,150 310,165 300,150 180,150" fill="#cbd5e1"/>
        <circle cx="180" cy="150" r="5" fill="#475569"/>
        <!-- Handles -->
        <ellipse cx="120" cy="120" rx="35" ry="22" fill="none" stroke="#2563eb" stroke-width="12"/>
        <ellipse cx="120" cy="180" rx="35" ry="22" fill="none" stroke="#2563eb" stroke-width="12"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">ATK-004</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Gunting Joyko Stainless</text>
</svg>