<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#3b82f6" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <!-- Paper Ream -->
      <polygon points="120,90 280,90 320,130 160,130" fill="#f8fafc"/>
      <polygon points="120,90 160,130 160,200 120,160" fill="#cbd5e1"/>
      <polygon points="160,130 320,130 320,200 160,200" fill="#e2e8f0"/>
      <!-- Label Wrapper Band -->
      <polygon points="190,130 270,130 270,200 190,200" fill="#1d4ed8"/>
      <text x="230" y="160" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="900" text-anchor="middle">SINARMAS</text>
      <text x="230" y="176" fill="#bfdbfe" font-size="9" font-family="sans-serif" text-anchor="middle">HVS A4 80gsm</text>
      <text x="230" y="190" fill="#ffffff" font-size="8" font-family="sans-serif" text-anchor="middle">500 SHEETS</text>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">ATK-002</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Kertas HVS A4 80gr</text>
</svg>