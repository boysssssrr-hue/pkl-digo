<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#0d9488" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <g transform="translate(100, 50)">
        <!-- 3-Tier Shelves -->
        <rect x="40" y="70" width="120" height="12" rx="2" fill="#334155"/>
        <rect x="40" y="115" width="120" height="12" rx="2" fill="#334155"/>
        <rect x="40" y="160" width="160" height="16" rx="4" fill="#1e293b"/>
        <!-- Frame Pillars -->
        <line x1="50" y1="40" x2="50" y2="160" stroke="#0d9488" stroke-width="6"/>
        <line x1="150" y1="40" x2="150" y2="160" stroke="#0d9488" stroke-width="6"/>
        <!-- Yellow Vinyl Trash Bag -->
        <rect x="150" y="55" width="45" height="105" rx="6" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
        <!-- Wheels -->
        <circle cx="50" cy="185" r="12" fill="#0f172a"/>
        <circle cx="185" cy="185" r="12" fill="#0f172a"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">CLN-004</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Janitor Cleaning Cart Trolley</text>
</svg>