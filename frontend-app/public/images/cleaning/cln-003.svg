<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#eab308" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <g transform="translate(130, 45)">
        <!-- Karcher Yellow Body -->
        <rect x="40" y="50" width="60" height="110" rx="14" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
        <rect x="55" y="20" width="30" height="35" rx="6" fill="#0f172a"/>
        <!-- Grille Vents -->
        <line x1="50" y1="80" x2="90" y2="80" stroke="#713f12" stroke-width="2"/>
        <line x1="50" y1="95" x2="90" y2="95" stroke="#713f12" stroke-width="2"/>
        <line x1="50" y1="110" x2="90" y2="110" stroke="#713f12" stroke-width="2"/>
        <!-- Spray Lance Wand -->
        <line x1="105" y1="60" x2="135" y2="170" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <!-- Large Wheels -->
        <circle cx="35" cy="155" r="16" fill="#0f172a" stroke="#ca8a04" stroke-width="3"/>
        <circle cx="105" cy="155" r="16" fill="#0f172a" stroke="#ca8a04" stroke-width="3"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">CLN-003</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">High Pressure Washer 140 Bar</text>
</svg>