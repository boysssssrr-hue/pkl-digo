<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#0284c7" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <g transform="translate(130, 50)">
        <!-- Stainless Canister -->
        <rect x="35" y="70" width="70" height="90" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
        <line x1="35" y1="100" x2="105" y2="100" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="35" y1="130" x2="105" y2="130" stroke="#cbd5e1" stroke-width="2"/>
        <!-- Motor Head -->
        <path d="M30,70 L110,70 L100,35 L40,35 Z" fill="#0284c7"/>
        <rect x="55" y="22" width="30" height="15" rx="4" fill="#0f172a"/>
        <!-- Hose Inlet -->
        <circle cx="70" cy="85" r="10" fill="#0f172a"/>
        <!-- Hose Flex -->
        <path d="M70,85 Q20,100 10,160" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
        <!-- Wheels -->
        <circle cx="35" cy="165" r="8" fill="#0f172a"/>
        <circle cx="105" cy="165" r="8" fill="#0f172a"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">CLN-002</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Industrial Vacuum Cleaner 30L</text>
</svg>