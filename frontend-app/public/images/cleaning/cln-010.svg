<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#475569" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <g transform="translate(130, 60)">
        <!-- Roll of Black Trash Bags -->
        <rect x="20" y="45" width="90" height="85" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
        <!-- Roll Band -->
        <rect x="45" y="45" width="40" height="85" fill="#dc2626"/>
        <text x="65" y="82" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="900" text-anchor="middle">HEAVY</text>
        <text x="65" y="95" fill="#fecaca" font-size="8" font-family="sans-serif" text-anchor="middle">DUTY</text>
        <ellipse cx="20" cy="87" rx="8" ry="42" fill="#1e293b"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">CLN-010</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Kantong Sampah Janitor Heavy Duty</text>
</svg>