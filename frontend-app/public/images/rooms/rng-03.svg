<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#d97706" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <!-- VIP Room Ambient -->
      <rect x="40" y="40" width="320" height="220" rx="8" fill="#292524"/>
      <!-- Luxury Wood Paneling -->
      <line x1="80" y1="40" x2="80" y2="260" stroke="#44403c" stroke-width="2"/>
      <line x1="320" y1="40" x2="320" y2="260" stroke="#44403c" stroke-width="2"/>
      <!-- Marble Oval Table -->
      <ellipse cx="200" cy="180" rx="110" ry="40" fill="#f8fafc" stroke="#d6d3d1" stroke-width="4"/>
      <ellipse cx="200" cy="180" rx="80" ry="25" fill="#e7e5e4"/>
      <!-- Executive Leather Chairs -->
      <rect x="130" y="130" width="28" height="35" rx="6" fill="#1c1917" stroke="#78716c" stroke-width="1.5"/>
      <rect x="186" y="125" width="28" height="35" rx="6" fill="#1c1917" stroke="#78716c" stroke-width="1.5"/>
      <rect x="242" y="130" width="28" height="35" rx="6" fill="#1c1917" stroke="#78716c" stroke-width="1.5"/>
      <!-- Ambient Chandelier / Warm Light -->
      <ellipse cx="200" cy="65" rx="40" ry="12" fill="#fbbf24" fill-opacity="0.4"/>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">RNG-03</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Ruang Rapat Eksekutif VIP</text>
</svg>