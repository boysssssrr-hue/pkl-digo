<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#0d9488" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <!-- Collaborative Room -->
      <rect x="40" y="40" width="320" height="220" rx="8" fill="#0f172a"/>
      <!-- Digital Whiteboard with Sticky Notes -->
      <rect x="110" y="55" width="180" height="90" rx="4" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/>
      <rect x="130" y="70" width="20" height="20" fill="#facc15"/>
      <rect x="160" y="70" width="20" height="20" fill="#38bdf8"/>
      <rect x="190" y="70" width="20" height="20" fill="#f43f5e"/>
      <rect x="220" y="70" width="20" height="20" fill="#4ade80"/>
      <!-- Modular Discussion Sofas -->
      <rect x="60" y="170" width="70" height="50" rx="10" fill="#0d9488"/>
      <rect x="270" y="170" width="70" height="50" rx="10" fill="#0d9488"/>
      <!-- Round Coffee Table -->
      <circle cx="200" cy="195" r="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">RNG-05</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Ruang Kolaborasi Brainstorming</text>
</svg>