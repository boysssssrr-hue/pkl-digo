<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#9333ea" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <!-- Studio Acoustic Dark Room -->
      <rect x="40" y="40" width="320" height="220" rx="8" fill="#09090b"/>
      <!-- Acoustic Foam Wall Pattern -->
      <g fill="#27272a">
        <rect x="60" y="55" width="25" height="25" rx="3"/><rect x="90" y="55" width="25" height="25" rx="3"/><rect x="120" y="55" width="25" height="25" rx="3"/>
        <rect x="255" y="55" width="25" height="25" rx="3"/><rect x="285" y="55" width="25" height="25" rx="3"/><rect x="315" y="55" width="25" height="25" rx="3"/>
      </g>
      <!-- Neon ON AIR Sign -->
      <rect x="160" y="50" width="80" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
      <text x="200" y="68" fill="#fca5a5" font-size="11" font-family="sans-serif" font-weight="900" text-anchor="middle">● ON AIR</text>
      <!-- Podcast Mics on Boom Arms -->
      <ellipse cx="200" cy="180" rx="70" ry="30" fill="#18181b" stroke="#a855f7" stroke-width="2"/>
      <path d="M160,180 L160,140 L165,130" fill="none" stroke="#e4e4e7" stroke-width="4"/>
      <rect x="155" y="115" width="20" height="20" rx="6" fill="#3f3f46"/>
      <path d="M240,180 L240,140 L235,130" fill="none" stroke="#e4e4e7" stroke-width="4"/>
      <rect x="225" y="115" width="20" height="20" rx="6" fill="#3f3f46"/>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">RNG-04</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Studio Podcast & Multimedia</text>
</svg>