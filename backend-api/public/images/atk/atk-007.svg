<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#eab308" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <g transform="rotate(35 200 150)">
        <!-- Body -->
        <rect x="120" y="125" width="130" height="50" rx="12" fill="#facc15"/>
        <rect x="250" y="130" width="30" height="40" rx="6" fill="#0f172a"/>
        <!-- Chisel Tip -->
        <polygon points="120,135 90,145 90,155 120,165" fill="#fef08a"/>
        <text x="185" y="156" fill="#0f172a" font-size="16" font-family="sans-serif" font-weight="900" text-anchor="middle">STABILO</text>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">ATK-007</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Stabilo Boss Highlighter</text>
</svg>