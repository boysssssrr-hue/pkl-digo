<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#8b5cf6" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <g transform="translate(130, 80)">
        <polygon points="20,100 120,100 100,50 40,50" fill="#020617" stroke="#334155" stroke-width="3"/>
        <!-- Wire Arms -->
        <path d="M40,50 L50,10 L70,10 L60,50" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
        <path d="M100,50 L90,10 L70,10 L80,50" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
        <rect x="35" y="70" width="70" height="15" rx="3" fill="#1e293b"/>
        <text x="70" y="82" fill="#94a3b8" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">JOYKO 51mm</text>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">ATK-005</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Binder Clip Joyko 51mm</text>
</svg>