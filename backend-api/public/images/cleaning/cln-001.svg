<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#059669" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <g transform="translate(130, 40)">
        <!-- Long Handle -->
        <rect x="65" y="10" width="10" height="130" rx="4" fill="#64748b"/>
        <!-- Dual Grip Handlebar -->
        <rect x="35" y="10" width="70" height="12" rx="6" fill="#0f172a"/>
        <!-- Motor Housing -->
        <ellipse cx="70" cy="150" rx="45" ry="25" fill="#059669" stroke="#10b981" stroke-width="3"/>
        <circle cx="70" cy="140" r="18" fill="#0f172a"/>
        <!-- 17-inch Pad Base -->
        <ellipse cx="70" cy="175" rx="65" ry="18" fill="#1e293b"/>
        <ellipse cx="70" cy="180" rx="60" ry="12" fill="#ef4444"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">CLN-001</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Mesin Polisher Lantai 17"</text>
</svg>