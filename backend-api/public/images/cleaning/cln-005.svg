<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#6366f1" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <g transform="translate(80, 55)">
        <!-- Machine Body -->
        <path d="M30,135 L40,85 Q50,45 100,45 L180,45 Q210,60 220,135 Z" fill="#4f46e5"/>
        <rect x="80" y="25" width="35" height="25" rx="6" fill="#1e1b4b"/>
        <!-- Steering Wheel -->
        <circle cx="97" cy="20" r="10" fill="none" stroke="#ffffff" stroke-width="3"/>
        <!-- Squeegee Base -->
        <rect x="25" y="130" width="200" height="18" rx="4" fill="#1e293b"/>
        <!-- Heavy Wheels -->
        <circle cx="65" cy="140" r="22" fill="#0f172a" stroke="#818cf8" stroke-width="4"/>
        <circle cx="185" cy="140" r="22" fill="#0f172a" stroke="#818cf8" stroke-width="4"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">CLN-005</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Ride-on Floor Scrubber Dryer</text>
</svg>