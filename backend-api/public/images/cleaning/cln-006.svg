<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#10b981" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <g transform="translate(100, 60)">
        <!-- Bucket -->
        <polygon points="30,75 130,75 120,145 40,145" fill="#059669"/>
        <!-- Dual Wringer Slot -->
        <rect x="75" y="60" width="55" height="35" rx="4" fill="#10b981"/>
        <line x1="85" y1="50" x2="85" y2="70" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        <!-- Mop Handle & Head -->
        <line x1="140" y1="10" x2="65" y2="135" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
        <circle cx="65" cy="135" r="18" fill="#f8fafc"/>
        <path d="M50,135 Q65,155 80,135" stroke="#cbd5e1" stroke-width="4" fill="none"/>
        <!-- Wheels -->
        <circle cx="45" cy="155" r="8" fill="#0f172a"/>
        <circle cx="115" cy="155" r="8" fill="#0f172a"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">CLN-006</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Mop Set Microfiber Bucket</text>
</svg>