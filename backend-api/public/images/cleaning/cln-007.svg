<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#0d9488" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <g transform="translate(120, 40)">
        <!-- Broom Handle -->
        <line x1="50" y1="15" x2="80" y2="150" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
        <!-- Broom Bristles -->
        <polygon points="70,145 110,145 120,185 60,185" fill="#14b8a6"/>
        <!-- Dustpan Handle & Pan -->
        <line x1="130" y1="50" x2="130" y2="150" stroke="#64748b" stroke-width="5"/>
        <polygon points="110,150 150,150 160,185 100,185" fill="#334155"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">CLN-007</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Sapu Lantai Nilon & Pengki</text>
</svg>