<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="105" fill="#2563eb" fill-opacity="0.08"/>
  <g filter="url(#shadow)">
    
      <!-- Hall Background -->
      <rect x="40" y="40" width="320" height="220" rx="8" fill="#1e1b4b"/>
      <!-- Huge Stage LED Screen -->
      <rect x="90" y="55" width="220" height="95" rx="6" fill="#020617" stroke="#818cf8" stroke-width="3"/>
      <text x="200" y="105" fill="#a5b4fc" font-size="13" font-family="sans-serif" font-weight="900" text-anchor="middle">LED VIDEOTRON 4x3m</text>
      <!-- Stage Podium & Platform -->
      <polygon points="70,180 330,180 350,150 50,150" fill="#312e81"/>
      <rect x="185" y="130" width="30" height="30" rx="2" fill="#4338ca"/>
      <!-- Seminar Audience Chairs -->
      <g fill="#475569">
        <circle cx="80" cy="210" r="10"/><circle cx="120" cy="210" r="10"/><circle cx="160" cy="210" r="10"/>
        <circle cx="200" cy="210" r="10"/><circle cx="240" cy="210" r="10"/><circle cx="280" cy="210" r="10"/><circle cx="320" cy="210" r="10"/>
      </g>
    
  </g>
  <rect x="16" y="248" width="160" height="36" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="266" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">RNG-02</text>
  <text x="28" y="278" fill="#94a3b8" font-size="9" font-family="sans-serif">Aula Serbaguna Diklat</text>
</svg>